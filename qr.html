<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McEnergy × SONY | QR Stickers FCU / AHU</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#16264A;--navy-soft:#2A3D66;--green:#22A45D;--line:#E3E5EF;--page:#F4F5FB;--ink:#1A2233;--soft:#5A6178;--faint:#9299AC;}
*{box-sizing:border-box;}
body{margin:0;background:var(--page);font-family:'Inter','Noto Sans Thai',sans-serif;color:var(--ink);}
.ctl{max-width:900px;margin:0 auto;padding:18px 16px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;}
.bar{background:var(--navy);color:#fff;margin:-18px -18px 14px;padding:10px 18px;font-size:12px;font-weight:700;letter-spacing:.05em;border-radius:12px 12px 0 0;}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 6px;}
input,textarea{font:inherit;font-size:15px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--page);}
textarea{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:13px;}
.note{font-size:12px;color:var(--faint);margin-top:6px;line-height:1.5;}
.btn{font:inherit;font-weight:700;border:none;background:var(--navy);color:#fff;border-radius:9px;padding:11px 16px;font-size:14px;cursor:pointer;margin-top:12px;}
/* ---- sheet A4 ---- */
.sheet{width:210mm;min-height:297mm;margin:0 auto 20px;background:#fff;padding:10mm;display:grid;grid-template-columns:repeat(var(--cols),var(--w));grid-auto-rows:var(--h);gap:5mm;justify-content:center;align-content:start;box-shadow:0 4px 20px rgba(0,0,0,.15);}
.stk{position:relative;overflow:hidden;background:#fff;display:flex;flex-direction:column;}
.stk .qr svg{width:100%;height:100%;display:block;}
.qwrap{position:relative;}
.qwrap .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;height:24%;background:#fff;border-radius:18%;display:flex;align-items:center;justify-content:center;padding:4%;}
.qwrap .ctr img{width:100%;height:100%;object-fit:contain;}
.mce-chip{background:#fff;border-radius:1.2mm;padding:.8mm 1.4mm;display:inline-flex;}
.mce-chip img{height:5.6mm;display:block;}
.inv{filter:brightness(0) invert(1);}
.nm,.loc{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

/* 1 — แนวนอน */
.d1{border:.4mm solid var(--navy);border-radius:3mm;flex-direction:row !important;}
.d1 .l{width:47mm;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3mm;border-right:.3mm dashed #C9CEE0;}
.d1 .qr{width:40mm;height:40mm;}
.d1 .l .s{font-size:2.2mm;font-weight:700;color:var(--navy);margin-top:1.4mm;letter-spacing:.06em;}
.d1 .r{flex:1;position:relative;background:linear-gradient(160deg,var(--navy),var(--navy-soft));color:#fff;padding:3.4mm 3.6mm;display:flex;flex-direction:column;}
.d1 .r::after{content:'';position:absolute;right:0;bottom:0;width:100%;height:14mm;background:var(--green);clip-path:polygon(0 100%,100% 30%,100% 42%,0 112%);}
.d1 .lg{display:flex;align-items:center;gap:2mm;}
.d1 .lg .sony{height:2.4mm;margin-left:auto;}
.d1 .typ{margin-top:3.4mm;font-size:2.2mm;font-weight:800;letter-spacing:.16em;color:#8FD9B4;}
.d1 .num{font-family:'Sora';font-weight:800;font-size:7mm;line-height:1.05;margin-top:.6mm;}
.d1 .nm{font-size:2.6mm;font-weight:600;margin-top:1.2mm;color:#E4E9F6;}
.d1 .loc{font-size:2.3mm;color:#B9C6E0;margin-top:.8mm;line-height:1.3;}

/* 2 — เส้นทแยง (ล่าง) */
.d2{border:.4mm solid var(--navy);border-radius:3mm;}
.d2 .top{display:flex;align-items:center;justify-content:space-between;padding:3mm 3.2mm 0;}
.d2 .top img.m{height:6mm;} .d2 .top img.sony{height:3mm;}
.d2 .qr{width:44mm;height:44mm;margin:3.4mm auto 0;}
.d2 .s{text-align:center;font-size:2.3mm;font-weight:700;color:var(--soft);margin-top:1.6mm;letter-spacing:.05em;}
.d2 .bt{margin-top:auto;position:relative;background:linear-gradient(120deg,var(--navy),var(--navy-soft));color:#fff;padding:7mm 3.4mm 3mm;clip-path:polygon(0 4.5mm,100% 0,100% 100%,0 100%);}
.d2 .bt::before{content:'';position:absolute;left:0;right:0;top:0;height:6mm;background:var(--green);clip-path:polygon(0 75%,100% 0,100% 22%,0 97%);}
.d2 .num{font-family:'Sora';font-weight:800;font-size:6.6mm;line-height:1.05;}
.d2 .typ{display:inline-block;background:var(--green);font-size:2mm;font-weight:800;letter-spacing:.12em;padding:.3mm 1.6mm;border-radius:.8mm;margin-left:1.6mm;vertical-align:middle;}
.d2 .nm{font-size:2.5mm;margin-top:.8mm;color:#E4E9F6;}
.d2 .loc{font-size:2.2mm;color:#B9C6E0;margin-top:.4mm;}

/* 3 — มินิมอล + โลโก้กลาง QR */
.d3{border:.3mm solid #D6D9F0;border-radius:4mm;align-items:center;padding:4mm 3.6mm 3mm;}
.d3 .sony{height:3.4mm;}
.d3 .ln{width:12mm;height:.6mm;background:var(--green);border-radius:1mm;margin:2.6mm 0 3mm;}
.d3 .qr{width:46mm;height:46mm;}
.d3 .num{font-family:'Sora';font-weight:800;font-size:7mm;color:var(--navy);margin-top:3mm;line-height:1;}
.d3 .typ{font-size:2.2mm;font-weight:700;letter-spacing:.2em;color:var(--green);margin-top:1.4mm;}
.d3 .nm{font-size:2.5mm;color:var(--ink);margin-top:1.4mm;text-align:center;}
.d3 .loc{font-size:2.2mm;color:var(--soft);margin-top:.5mm;text-align:center;}
.d3 .ft{margin-top:auto;display:flex;align-items:center;gap:1.6mm;font-size:1.9mm;color:var(--faint);}
.d3 .ft img{height:4mm;}

/* 4 — น้ำเงินเข้มทั้งใบ */
.d4{background:linear-gradient(165deg,var(--navy),#0F1B38) !important;border-radius:3mm;color:#fff;align-items:center;padding:3.4mm 3.4mm 0;}
.d4 .top{width:100%;display:flex;justify-content:space-between;align-items:center;}
.d4 .top .sony{height:2.9mm;}
.d4 .box{background:#fff;border-radius:3mm;padding:3mm;margin-top:3.6mm;}
.d4 .qr{width:40mm;height:40mm;}
.d4 .s{font-size:2.2mm;color:#F5C518;font-weight:700;letter-spacing:.12em;margin-top:2.4mm;}
.d4 .num{font-family:'Sora';font-weight:800;font-size:7mm;margin-top:1mm;line-height:1.05;}
.d4 .nm{font-size:2.5mm;color:#DDE3F2;margin-top:.8mm;text-align:center;}
.d4 .loc{font-size:2.2mm;color:#9FAACC;margin-top:.4mm;text-align:center;}
.d4 .ft{margin-top:auto;width:calc(100% + 6.8mm);height:2.4mm;background:linear-gradient(90deg,var(--green),#8FD9B4);}

/* 5 — ป้ายแขวน */
.d5{border:.4mm solid var(--navy);border-radius:7mm 7mm 3mm 3mm;align-items:center;}
.d5 .hole{width:6mm;height:6mm;border-radius:50%;border:.4mm solid #B9C0D6;margin-top:2.6mm;background:var(--page);}
.d5 .hd{width:100%;text-align:center;margin-top:2mm;padding:2.2mm 0;background:var(--green);color:#fff;font-size:2.4mm;font-weight:800;letter-spacing:.12em;}
.d5 .lg{display:flex;align-items:center;gap:2.4mm;margin-top:2.6mm;}
.d5 .lg .m{height:5mm;} .d5 .lg .x{color:var(--faint);font-size:2.4mm;} .d5 .lg .sony{height:2.6mm;}
.d5 .qr{width:38mm;height:38mm;margin-top:2.4mm;}
.d5 .num{font-family:'Sora';font-weight:800;font-size:6.6mm;color:var(--navy);margin-top:2mm;line-height:1;}
.d5 .nm{font-size:2.4mm;margin-top:1mm;text-align:center;padding:0 3mm;}
.d5 .loc{font-size:2.2mm;color:var(--soft);text-align:center;padding:0 3mm;margin-top:.4mm;}

/* 6 — เลขเครื่องใหญ่ */
.d6{border:.4mm solid var(--navy);border-radius:3mm;}
.d6 .hd{position:relative;background:linear-gradient(120deg,var(--navy),var(--navy-soft));color:#fff;padding:3mm 3.4mm 7mm;clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 4.5mm));}
.d6 .hd::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6mm;background:var(--green);clip-path:polygon(0 22%,100% 100%,100% 78%,0 0);}
.d6 .lg{display:flex;justify-content:space-between;align-items:center;}
.d6 .lg .sony{height:2.8mm;}
.d6 .typ{margin-top:3mm;font-size:2.2mm;letter-spacing:.2em;color:#8FD9B4;font-weight:800;}
.d6 .num{font-family:'Sora';font-weight:800;font-size:9.4mm;line-height:1;margin-top:.6mm;}
.d6 .nm{font-size:2.4mm;color:#DDE3F2;margin-top:1mm;}
.d6 .qr{width:35mm;height:35mm;margin:2.4mm auto 0;}
.d6 .loc{text-align:center;font-size:2.3mm;color:var(--soft);margin-top:1.6mm;padding:0 3mm;}
.d6 .s{text-align:center;margin-top:auto;padding:1.6mm;font-size:2mm;font-weight:700;letter-spacing:.08em;color:var(--navy);border-top:.3mm dashed #C9CEE0;}


/* ===== navy family (4 + 7-11) ===== */
.nv{background:linear-gradient(165deg,var(--navy),#0F1B38) !important;border-radius:3mm;color:#fff;}
.nv .top{display:flex;justify-content:space-between;align-items:center;}
.nv .sony{height:2.9mm;}
.nv .box{background:#fff;border-radius:3mm;padding:2.6mm;}
.nv .nm{font-size:2.5mm;color:#DDE3F2;margin-top:.8mm;}
.nv .loc{font-size:2.2mm;color:#9FAACC;margin-top:.4mm;}
/* 7 — น้ำเงิน + แถบเฉียง */
.d7{padding:3.4mm 3.4mm 0;align-items:center;}
.d7 .top{width:100%;}
.d7 .box{margin-top:3.4mm;} .d7 .qr{width:40mm;height:40mm;}
.d7 .s{font-size:2.1mm;color:#8FD9B4;font-weight:700;letter-spacing:.14em;margin-top:2.2mm;}
.d7 .bt{margin-top:auto;width:calc(100% + 6.8mm);position:relative;background:#fff;color:var(--navy);padding:6.4mm 3.4mm 2.6mm;clip-path:polygon(0 4mm,100% 0,100% 100%,0 100%);text-align:center;}
.d7 .bt::before{content:'';position:absolute;left:0;right:0;top:0;height:5.6mm;background:var(--green);clip-path:polygon(0 72%,100% 0,100% 24%,0 96%);}
.d7 .num{font-family:'Sora';font-weight:800;font-size:6.6mm;line-height:1;}
.d7 .bt .nm{color:var(--ink);} .d7 .bt .loc{color:var(--soft);}
/* 8 — น้ำเงิน-ทอง พรีเมียม */
.d8{padding:3.6mm;align-items:center;border:.5mm solid #C9A24A;}
.d8 .top{width:100%;}
.d8 .gl{width:100%;height:.35mm;background:linear-gradient(90deg,transparent,#E2BE63,transparent);margin:3mm 0;}
.d8 .box{border:.5mm solid #E2BE63;} .d8 .qr{width:38mm;height:38mm;}
.d8 .s{font-size:2.1mm;color:#E2BE63;font-weight:700;letter-spacing:.22em;margin-top:2.6mm;}
.d8 .num{font-family:'Sora';font-weight:800;font-size:7mm;margin-top:1.2mm;line-height:1;}
.d8 .nm,.d8 .loc{text-align:center;}
.d8 .ft{margin-top:auto;font-size:1.9mm;letter-spacing:.2em;color:#E2BE63;}
/* 9 — น้ำเงิน แนวนอน */
.d9{flex-direction:row !important;padding:3mm;gap:3.4mm;align-items:center;}
.d9 .box{padding:2.2mm;flex:0 0 auto;} .d9 .qr{width:38mm;height:38mm;}
.d9 .r{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;}
.d9 .sony{height:2.5mm;}
.d9 .typ{margin-top:auto;font-size:2.1mm;color:#8FD9B4;font-weight:800;letter-spacing:.16em;}
.d9 .num{font-family:'Sora';font-weight:800;font-size:6.6mm;line-height:1.05;margin-top:.6mm;}
.d9 .ac{height:.8mm;width:14mm;background:var(--green);border-radius:1mm;margin:2mm 0 0;}
.d9 .s{margin-top:auto;font-size:1.9mm;color:#F5C518;font-weight:700;letter-spacing:.1em;}
/* 10 — น้ำเงิน เลขใหญ่ */
.d10{padding:3.4mm 3.4mm 0;}
.d10 .typ{margin-top:2.6mm;font-size:2.1mm;color:#8FD9B4;font-weight:800;letter-spacing:.2em;}
.d10 .num{font-family:'Sora';font-weight:800;font-size:9.2mm;line-height:1;margin-top:.4mm;}
.d10 .box{margin:3mm auto 0;} .d10 .qr{width:35mm;height:35mm;}
.d10 .loc{text-align:center;margin-top:1.6mm;}
.d10 .ft{margin:auto -3.4mm 0;background:var(--green);color:#fff;text-align:center;font-size:2mm;font-weight:800;letter-spacing:.1em;padding:1.6mm;}
/* 11 — น้ำเงิน + กรอบสแกน */
.d11{padding:3.4mm;align-items:center;}
.d11 .top{width:100%;}
.d11 .vf{position:relative;margin-top:4mm;padding:3mm;}
.d11 .vf i{position:absolute;width:7mm;height:7mm;border:.9mm solid var(--green);}
.d11 .vf i:nth-child(1){left:0;top:0;border-right:none;border-bottom:none;border-radius:2mm 0 0 0;}
.d11 .vf i:nth-child(2){right:0;top:0;border-left:none;border-bottom:none;border-radius:0 2mm 0 0;}
.d11 .vf i:nth-child(3){left:0;bottom:0;border-right:none;border-top:none;border-radius:0 0 0 2mm;}
.d11 .vf i:nth-child(4){right:0;bottom:0;border-left:none;border-top:none;border-radius:0 0 2mm 0;}
.d11 .box{padding:2mm;border-radius:2mm;} .d11 .qr{width:34mm;height:34mm;}
.d11 .s{margin-top:2.4mm;background:var(--green);color:#fff;font-size:2.2mm;font-weight:800;letter-spacing:.16em;padding:.7mm 3mm;border-radius:99px;}
.d11 .num{font-family:'Sora';font-weight:800;font-size:6.8mm;margin-top:2mm;line-height:1;}
.d11 .nm,.d11 .loc{text-align:center;}
.cv-grp2{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--navy);margin-top:4px;}


/* 12 — แบบ 9 พื้นขาว */
.d12{flex-direction:row !important;padding:3mm;gap:3.4mm;align-items:center;background:#fff;border:.4mm solid var(--navy);border-radius:3mm;color:var(--navy);}
.d12 .box{flex:0 0 auto;padding:2mm;border:.3mm solid #D6D9F0;border-radius:2.4mm;}
.d12 .qr{width:38mm;height:38mm;}
.d12 .r{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;}
.d12 .top{display:flex;justify-content:space-between;align-items:center;}
.d12 .top .m{height:5.6mm;} .d12 .top .sony{height:2.5mm;}
.d12 .typ{margin-top:auto;font-size:2.1mm;color:var(--green);font-weight:800;letter-spacing:.16em;}
.d12 .num{font-family:'Sora';font-weight:800;font-size:6.6mm;line-height:1.05;margin-top:.6mm;color:var(--navy);}
.d12 .nm{font-size:2.5mm;color:var(--ink);margin-top:.8mm;}
.d12 .loc{font-size:2.2mm;color:var(--soft);margin-top:.4mm;}
.d12 .ac{height:.8mm;width:14mm;background:var(--green);border-radius:1mm;margin:2mm 0 0;}
.d12 .s{margin-top:auto;font-size:1.9mm;color:var(--navy);font-weight:700;letter-spacing:.1em;}

/* picker */
.dpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px;}
.dpick button{font:inherit;font-size:12.5px;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:9px;padding:9px 4px;cursor:pointer;color:var(--soft);}
.dpick button.on{border-color:var(--green);color:#1F7248;background:#E6F5EC;}
@media(max-width:640px){.dpick{grid-template-columns:repeat(3,1fr);}}
@media print{
  @page{size:A4;margin:0;}
  body{background:#fff;}
  .ctl{display:none;}
  .sheet{margin:0;box-shadow:none;page-break-after:always;}
  .sheet:last-child{page-break-after:auto;}
  .stk,.stk *,.stk::before,.stk::after{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<div class="ctl">
  <div class="card"><div class="bar">QR STICKERS · FCU / AHU · SONY</div>
    <label>แบบสติกเกอร์</label><div class="dpick" id="dpick"></div>
    <label>URL ของหน้ารายงานบนเว็บ (เปิดไฟล์นี้จาก Vercel แล้วจะใส่ให้อัตโนมัติ)</label>
    <input id="base" placeholder="https://ชื่อโปรเจกต์.vercel.app/">
    <div class="note">QR จะชี้ไปที่ URL นี้ ต่อท้ายด้วย ?unit=…&type=…&loc=… ของแต่ละเครื่อง</div>
    <label>รายการเครื่อง (วางจาก Excel ได้) — Number | Name | Location | Type</label>
    <textarea id="list"></textarea>
    <div class="note">1 บรรทัด = 1 เครื่อง คั่นด้วย Tab (คัดลอกจาก Excel) · Type ไม่ใส่ก็ได้ ระบบดูจาก Number ให้ (AHU / FCU)</div>
    <button class="btn" id="go">สร้างสติกเกอร์</button> <button class="btn" id="pr" style="background:#F5B301;color:#16264A">🖨 พิมพ์</button>
  </div>
</div>

function E(r){ return { num:esc(r.num), nm:esc(r.name), loc:esc(r.loc), typ:esc(r.type), u:url(r) }; }
function stk(r){
  var e = E(r), mce = '<span class="mce-chip"><img src="' + MCE + '"></span>';
  var nm = e.nm ? '<div class="nm">' + e.nm + '</div>' : '', loc = e.loc ? '<div class="loc">' + e.loc + '</div>' : '';
  switch(cur){
  case 1: return '<div class="stk d1"><div class="l">' + qr(e.u) + '<div class="s">SCAN FOR REPORT</div></div>' +
      '<div class="r"><div class="lg">' + mce + '<img class="sony inv" src="' + SONY + '"></div>' +
      '<div class="typ">' + (e.typ || 'UNIT') + ' · CLEANING REPORT</div><div class="num">' + e.num + '</div>' + nm + loc + '</div></div>';
  case 3: return '<div class="stk d3"><img class="sony" src="' + SONY + '"><div class="ln"></div>' + qr(e.u, MARK) +
      '<div class="num">' + e.num + '</div><div class="typ">' + (e.typ || '') + ' CLEANING REPORT</div>' + nm + loc +
      '<div class="ft">Service by <img src="' + MCE + '"></div></div>';
  case 4: return '<div class="stk d4"><div class="top">' + mce + '<img class="sony inv" src="' + SONY + '"></div>' +
      '<div class="box">' + qr(e.u) + '</div><div class="s">SCAN · สแกนทำรายงาน</div><div class="num">' + e.num + '</div>' + nm + loc + '<div class="ft"></div></div>';
  case 7: return '<div class="stk nv d7"><div class="top">' + mce + '<img class="sony inv" src="' + SONY + '"></div><div class="box">' + qr(e.u) + '</div>' +
      '<div class="s">SCAN · สแกนทำรายงาน</div><div class="bt"><div class="num">' + e.num + '</div>' + nm + loc + '</div></div>';
  case 8: return '<div class="stk nv d8"><div class="top">' + mce + '<img class="sony inv" src="' + SONY + '"></div><div class="gl"></div><div class="box">' + qr(e.u, MARK) + '</div>' +
      '<div class="s">SCAN FOR REPORT</div><div class="num">' + e.num + '</div>' + nm + loc + '<div class="ft">' + (e.typ || '') + ' · CLEANING REPORT</div></div>';
  case 9: return '<div class="stk nv d9"><div class="box">' + qr(e.u) + '</div><div class="r"><div class="top">' + mce + '<img class="sony inv" src="' + SONY + '"></div>' +
      '<div class="typ">' + (e.typ || 'UNIT') + ' · CLEANING REPORT</div><div class="num">' + e.num + '</div>' + nm + loc + '<div class="ac"></div><div class="s">SCAN · สแกนทำรายงาน</div></div></div>';
  case 10: return '<div class="stk nv d10"><div class="top">' + mce + '<img class="sony inv" src="' + SONY + '"></div><div class="typ">' + (e.typ || 'UNIT') + '</div>' +
      '<div class="num">' + e.num + '</div>' + nm + '<div class="box">' + qr(e.u) + '</div>' + loc + '<div class="ft">SCAN · สแกนเพื่อทำรายงานล้างเครื่อง</div></div>';
  case 11: return '<div class="stk nv d11"><div class="top">' + mce + '<img class="sony inv" src="' + SONY + '"></div><div class="vf"><i></i><i></i><i></i><i></i><div class="box">' + qr(e.u) + '</div></div>' +
      '<div class="s">SCAN ME</div><div class="num">' + e.num + '</div>' + nm + loc + '</div>';
  case 12: return '<div class="stk d12"><div class="box">' + qr(e.u) + '</div><div class="r"><div class="top"><img class="m" src="' + MCE + '"><img class="sony" src="' + SONY + '"></div>' +
      '<div class="typ">' + (e.typ || 'UNIT') + ' · CLEANING REPORT</div><div class="num">' + e.num + '</div>' + nm + loc + '<div class="ac"></div><div class="s">SCAN · สแกนทำรายงาน</div></div></div>';
  case 5: return '<div class="stk d5"><div class="hole"></div><div class="hd">' + (e.typ || 'UNIT') + ' · CLEANING REPORT</div>' +
      '<div class="lg"><img class="m" src="' + MCE + '"><span class="x">×</span><img class="sony" src="' + SONY + '"></div>' + qr(e.u) +
      '<div class="num">' + e.num + '</div>' + nm + loc + '</div>';
  case 6: return '<div class="stk d6"><div class="hd"><div class="lg">' + mce + '<img class="sony inv" src="' + SONY + '"></div>' +
      '<div class="typ">' + (e.typ || 'UNIT') + '</div><div class="num">' + e.num + '</div>' + (e.nm ? '<div class="nm">' + e.nm + '</div>' : '') + '</div>' +
      qr(e.u) + loc + '<div class="s">สแกนเพื่อทำรายงานล้างเครื่อง · SCAN FOR REPORT</div></div>';
  default: return '<div class="stk d2"><div class="top"><img class="m" src="' + MCE + '"><img class="sony" src="' + SONY + '"></div>' + qr(e.u) +

      '<div class="bt"><div class="num">' + e.num + (e.typ ? '<span class="typ">' + e.typ + '</span>' : '') + '</div>' + nm + loc + '</div></div>';
  }
}
function picker(){
  var btn = function(k){ return '<button type="button" data-k="' + k + '" class="' + (+k === cur ? 'on' : '') + '">' + k + '. ' + DESIGNS[k].n + '</button>'; };
  $('#dpick').innerHTML = '<div class="cv-grp2">แบบที่เลือก และสไตล์น้ำเงินเข้ม</div>' + ORDER.slice(0, 7).map(btn).join('') + '<div class="cv-grp2">แบบอื่น ๆ</div>' + ORDER.slice(7).map(btn).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#dpick button'), function(b){ b.onclick = function(){ cur = +b.dataset.k; try{ localStorage.setItem('qrDesign', cur); }catch(e){} picker(); draw(); }; });
}
function draw(){
  try{ localStorage.setItem('qrBase', $('#base').value); localStorage.setItem('qrList', $('#list').value); }catch(e){}
  var D = DESIGNS[cur], per = D.cols * Math.floor((277 + 5) / (D.h + 5)), R = rows(), html = '';
  for(var i = 0; i < R.length; i += per) html += '<div class="sheet" style="--cols:' + D.cols + ';--w:' + D.w + 'mm;--h:' + D.h + 'mm">' + R.slice(i, i + per).map(stk).join('') + '</div>';
  $('#out').innerHTML = html;
}
$('#go').onclick = draw; $('#pr').onclick = function(){ draw(); window.print(); };
picker(); draw();
})();
